<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gildia Zwiadowców Araluenu — Misja Finałowa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --forest: #1a2e1a;
    --forest-deep: #0d1a0d;
    --parchment: #f1e3c2;
    --parchment-shadow: #b89d6a;
    --ink: #3a2410;
    --gold: #d4af37;
    --gold-bright: #f8d568;
    --blood: #7a1a1a;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    width: 100%;
    overflow-x: hidden;
  }

  body {
    font-family: 'Cinzel', 'IM Fell English', Georgia, serif;
    color: var(--ink);
    background-color: var(--forest);
    background-image:
      radial-gradient(ellipse at 20% 10%, rgba(70, 110, 60, 0.35), transparent 55%),
      radial-gradient(ellipse at 80% 90%, rgba(20, 45, 25, 0.6), transparent 60%),
      radial-gradient(ellipse at 50% 50%, rgba(0, 0, 0, 0.5), transparent 70%),
      linear-gradient(180deg, #16291a 0%, #0d1a0d 100%);
    background-attachment: fixed;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      radial-gradient(circle at 15% 20%, rgba(0,0,0,0.45) 0%, transparent 35%),
      radial-gradient(circle at 85% 75%, rgba(0,0,0,0.45) 0%, transparent 35%);
    z-index: 0;
  }

  /* ==========================
     PARCHMENT CARD
     ========================== */
  .parchment {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 560px;
    padding: 56px 44px 48px;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(255, 240, 200, 0.6), transparent 60%),
      radial-gradient(ellipse at 100% 100%, rgba(120, 90, 50, 0.35), transparent 60%),
      radial-gradient(ellipse at 0% 100%, rgba(120, 90, 50, 0.35), transparent 60%),
      linear-gradient(180deg, #f3e6c4 0%, #e8d49d 100%);
    color: var(--ink);
    border: 1px solid rgba(90, 60, 25, 0.35);
    border-radius: 6px;
    box-shadow:
      0 0 0 6px rgba(40, 25, 10, 0.25),
      0 25px 60px rgba(0, 0, 0, 0.7),
      inset 0 0 80px rgba(120, 80, 30, 0.25),
      inset 0 0 12px rgba(80, 50, 20, 0.35);
    /* torn / uneven edges */
    clip-path: polygon(
      2% 1%, 8% 0.5%, 18% 1.5%, 30% 0.4%, 45% 1.2%, 60% 0.3%, 75% 1.4%, 88% 0.6%, 98% 2%,
      99.5% 10%, 98.8% 22%, 99.6% 38%, 98.7% 55%, 99.5% 72%, 98.6% 88%, 99.2% 98%,
      90% 99.4%, 75% 98.7%, 60% 99.5%, 45% 98.8%, 30% 99.6%, 18% 98.7%, 8% 99.4%, 1% 98%,
      0.6% 88%, 1.4% 72%, 0.4% 55%, 1.3% 38%, 0.5% 22%, 1.2% 10%
    );
  }

  /* faint stains on the parchment */
  .parchment::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image:
      radial-gradient(circle at 15% 20%, rgba(120, 80, 30, 0.18) 0%, transparent 12%),
      radial-gradient(circle at 80% 30%, rgba(120, 80, 30, 0.10) 0%, transparent 10%),
      radial-gradient(circle at 30% 80%, rgba(80, 50, 20, 0.12) 0%, transparent 14%),
      radial-gradient(circle at 70% 75%, rgba(140, 90, 40, 0.10) 0%, transparent 8%);
    mix-blend-mode: multiply;
    border-radius: inherit;
  }

  .crest {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 10px;
  }
  .crest img {
    width: 124px;
    height: 124px;
    object-fit: cover;
    border: none;
    box-shadow: none;
  }

  h1.title {
    font-family: 'Cinzel', serif;
    font-weight: 900;
    text-align: center;
    font-size: clamp(20px, 4.6vw, 28px);
    letter-spacing: 0.18em;
    margin: 0 0 6px;
    text-transform: uppercase;
    color: #2b1a08;
  }

  .subtitle {
    text-align: center;
    font-family: 'IM Fell English', serif;
    font-style: italic;
    font-size: clamp(13px, 2.6vw, 15px);
    color: #5a3a18;
    margin-bottom: 32px;
    opacity: 0.85;
  }

  .divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin: 18px 0 28px;
    color: rgba(90, 60, 25, 0.7);
  }
  .divider::before,
  .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(90, 60, 25, 0.55), transparent);
  }
  .divider span { font-size: 18px; }

  label.field-label {
    display: block;
    text-align: center;
    font-weight: 700;
    letter-spacing: 0.22em;
    font-size: clamp(12px, 2.6vw, 14px);
    margin-bottom: 12px;
    color: #2b1a08;
  }

  .input-wrap {
    position: relative;
    margin: 0 auto 24px;
    max-width: 420px;
  }

  input.password {
    width: 100%;
    padding: 14px 16px;
    font-family: 'Cinzel', serif;
    font-size: 16px;
    letter-spacing: 0.18em;
    text-align: center;
    text-transform: uppercase;
    color: #2b1a08;
    background: rgba(255, 248, 220, 0.55);
    border: 1px solid rgba(90, 60, 25, 0.5);
    border-radius: 3px;
    outline: none;
    box-shadow:
      inset 0 2px 6px rgba(80, 50, 20, 0.25),
      inset 0 -1px 0 rgba(255, 255, 255, 0.4);
    transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
  }
  input.password:focus {
    border-color: rgba(60, 40, 15, 0.9);
    background: rgba(255, 248, 220, 0.85);
    box-shadow:
      inset 0 2px 6px rgba(80, 50, 20, 0.35),
      0 0 0 3px rgba(212, 175, 55, 0.35);
  }
  input.password::placeholder {
    color: rgba(90, 60, 25, 0.45);
    font-style: italic;
    letter-spacing: 0.12em;
  }

  button.seal-btn {
    display: block;
    margin: 0 auto;
    padding: 14px 36px;
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: clamp(13px, 2.8vw, 15px);
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: #f3e6c4;
    background: linear-gradient(180deg, #4a3220 0%, #2b1a08 100%);
    border: 1px solid #1a0e04;
    border-radius: 3px;
    cursor: pointer;
    box-shadow:
      0 4px 0 #1a0e04,
      0 6px 14px rgba(0, 0, 0, 0.35),
      inset 0 1px 0 rgba(255, 220, 150, 0.25);
    transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.2s ease;
  }
  button.seal-btn:hover {
    background: linear-gradient(180deg, #5a3e28 0%, #34200d 100%);
  }
  button.seal-btn:active {
    transform: translateY(3px);
    box-shadow:
      0 1px 0 #1a0e04,
      0 2px 6px rgba(0, 0, 0, 0.35),
      inset 0 1px 0 rgba(255, 220, 150, 0.25);
  }

  .feedback {
    margin-top: 22px;
    min-height: 22px;
    text-align: center;
    font-family: 'IM Fell English', serif;
    font-size: 16px;
    letter-spacing: 0.05em;
    color: var(--blood);
    opacity: 0;
    transform: translateY(-4px);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .feedback.show {
    opacity: 1;
    transform: translateY(0);
  }

  .footer-mark {
    margin-top: 28px;
    text-align: center;
    font-family: 'IM Fell English', serif;
    font-style: italic;
    font-size: 13px;
    color: rgba(90, 60, 25, 0.7);
    letter-spacing: 0.08em;
  }

  /* ==========================
     SHAKE on wrong password
     ========================== */
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    15% { transform: translateX(-10px); }
    30% { transform: translateX(8px); }
    45% { transform: translateX(-6px); }
    60% { transform: translateX(4px); }
    75% { transform: translateX(-2px); }
  }
  .parchment.shake {
    animation: shake 0.55s cubic-bezier(.36,.07,.19,.97) both;
  }
  .parchment.error-glow {
    box-shadow:
      0 0 0 6px rgba(120, 20, 20, 0.45),
      0 0 60px rgba(180, 30, 30, 0.55),
      0 25px 60px rgba(0, 0, 0, 0.7),
      inset 0 0 80px rgba(120, 80, 30, 0.25),
      inset 0 0 12px rgba(80, 50, 20, 0.35);
  }

  /* ==========================
     SUCCESS OVERLAY
     ========================== */
  .success-overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    padding: 28px;
    background:
      radial-gradient(ellipse at center, rgba(40, 25, 5, 0.6) 0%, rgba(10, 18, 10, 0.92) 60%, rgba(5, 10, 5, 0.98) 100%);
    backdrop-filter: blur(2px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease;
  }
  .success-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }

  /* pulsing golden glow behind text */
  .glow {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(circle at center, rgba(248, 213, 104, 0.55) 0%, rgba(212, 175, 55, 0.18) 25%, transparent 55%);
    animation: pulseGlow 2.6s ease-in-out infinite;
  }
  @keyframes pulseGlow {
    0%, 100% { opacity: 0.55; transform: scale(1); }
    50%      { opacity: 1;    transform: scale(1.08); }
  }

  .success-content {
    position: relative;
    z-index: 2;
    max-width: 760px;
    transform: translateY(20px);
    opacity: 0;
    transition: opacity 0.8s ease 0.2s, transform 0.8s ease 0.2s;
  }
  .success-overlay.active .success-content {
    opacity: 1;
    transform: translateY(0);
  }

  .ornament {
    color: var(--gold-bright);
    font-size: 28px;
    letter-spacing: 0.5em;
    margin-bottom: 18px;
    text-shadow: 0 0 18px rgba(248, 213, 104, 0.7);
  }

  .mission-complete {
    font-family: 'Cinzel', serif;
    font-weight: 900;
    color: var(--gold-bright);
    font-size: clamp(36px, 9vw, 84px);
    letter-spacing: 0.18em;
    margin: 0;
    line-height: 1.05;
    text-transform: uppercase;
    text-shadow:
      0 0 12px rgba(248, 213, 104, 0.7),
      0 0 28px rgba(212, 175, 55, 0.55),
      0 4px 12px rgba(0, 0, 0, 0.6);
    animation: titleGlow 3s ease-in-out infinite;
  }
  @keyframes titleGlow {
    0%, 100% {
      text-shadow:
        0 0 12px rgba(248, 213, 104, 0.7),
        0 0 28px rgba(212, 175, 55, 0.55),
        0 4px 12px rgba(0, 0, 0, 0.6);
    }
    50% {
      text-shadow:
        0 0 22px rgba(248, 213, 104, 1),
        0 0 60px rgba(248, 213, 104, 0.7),
        0 4px 12px rgba(0, 0, 0, 0.6);
    }
  }

  .mission-sub {
    margin: 28px auto 0;
    color: #f1e3c2;
    font-family: 'Cinzel', serif;
    font-weight: 600;
    font-size: clamp(15px, 3vw, 22px);
    letter-spacing: 0.08em;
    line-height: 1.55;
    max-width: 720px;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
  }

  .mission-tag {
    margin: 22px auto 0;
    color: rgba(241, 227, 194, 0.7);
    font-family: 'IM Fell English', serif;
    font-style: italic;
    font-size: clamp(12px, 2.4vw, 15px);
    letter-spacing: 0.1em;
  }

  .divider-gold {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin: 26px auto 0;
    color: var(--gold);
    max-width: 360px;
  }
  .divider-gold::before,
  .divider-gold::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.7), transparent);
  }
  .divider-gold span {
    font-size: 14px;
    text-shadow: 0 0 10px rgba(248, 213, 104, 0.7);
  }

  /* ==========================
     CONFETTI canvas
     ========================== */
  #confetti {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 60;
  }

  /* ==========================
     RESPONSIVE
     ========================== */
  @media (max-width: 520px) {
    .parchment {
      padding: 40px 24px 36px;
      max-width: 100%;
    }
    h1.title { letter-spacing: 0.12em; }
    button.seal-btn { padding: 12px 24px; }
    input.password { font-size: 15px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .glow, .mission-complete { animation: none; }
    .parchment.shake { animation: none; }
  }
</style>
</head>
<body>

  <main class="parchment" id="parchment" role="main" aria-label="Karta finałowa">
    <div class="crest" aria-hidden="true">
      <img data-logo-img src="kruk.jpg" alt="" loading="lazy" decoding="async" />
    </div>

    <h1 class="title">Gildia Zwiadowców Araluenu</h1>
    <p class="subtitle">Karta finałowa — koniec wyprawy</p>

    <div class="divider" aria-hidden="true"><span>&#10086;</span></div>

    <form id="guildForm" autocomplete="off" novalidate>
      <label for="password" class="field-label">Wprowadź hasło Gildii</label>
      <div class="input-wrap">
        <input
          type="text"
          id="password"
          class="password"
          name="password"
          placeholder="...szepcie ostrożnie..."
          aria-label="Hasło Gildii"
          autocapitalize="characters"
          spellcheck="false"
        />
      </div>

      <button type="submit" class="seal-btn" id="submitBtn">Złóż raport</button>

      <div class="feedback" id="feedback" role="alert" aria-live="polite"></div>
    </form>

    <div class="footer-mark">&mdash; sygnowano pieczęcią Halta &mdash;</div>
  </main>

  <!-- Success overlay -->
  <section class="success-overlay" id="successOverlay" aria-hidden="true">
    <div class="glow"></div>
    <div class="success-content">
      <div class="ornament" aria-hidden="true">&#10086; &#x2731; &#10086;</div>
      <h2 class="mission-complete">Misja Ukończona</h2>
      <div class="divider-gold" aria-hidden="true"><span>&#10070;</span></div>
      <p class="mission-sub">Gildia Zwiadowców Araluenu przyjmuje Was w swoje szeregi.</p>
      <p class="mission-tag">Przysięga złożona. Peleryna zasłużona.</p>
    </div>
  </section>

  <canvas id="confetti" aria-hidden="true"></canvas>

<script>
(() => {
  const picked = (() => {
    const v = new URLSearchParams(window.location.search).get("logo");
    if (v === "kruk" || v === "sokol") return v;
    return Math.random() < 0.5 ? "kruk" : "sokol";
  })();
  document.querySelectorAll("[data-logo-img]").forEach((img) => {
    img.src = `${picked}.jpg`;
    img.alt = picked === "kruk" ? "Kruk" : "Sokol";
  });
})();

</script>
<script>
(() => {
  // ====== HASŁO GILDII (zmień w razie potrzeby) ======
  const GUILD_PASSWORD = "ARALUEN";
  // ===================================================

  const form     = document.getElementById('guildForm');
  const input    = document.getElementById('password');
  const feedback = document.getElementById('feedback');
  const card     = document.getElementById('parchment');
  const overlay  = document.getElementById('successOverlay');
  const canvas   = document.getElementById('confetti');

  const normalize = (s) => (s || '')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .trim()
    .toUpperCase();

  let unlocked = false;

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    if (unlocked) return;

    const value = normalize(input.value);
    if (value === normalize(GUILD_PASSWORD)) {
      unlock();
    } else {
      reject();
    }
  });

  function reject() {
    feedback.textContent = "Hasło nieprawidłowe. Szukajcie dalej.";
    feedback.classList.add('show');

    card.classList.remove('shake', 'error-glow');
    // restart animation
    void card.offsetWidth;
    card.classList.add('shake', 'error-glow');

    setTimeout(() => {
      card.classList.remove('error-glow');
    }, 900);

    input.select();
  }

  function unlock() {
    unlocked = true;
    feedback.textContent = "";
    feedback.classList.remove('show');

    overlay.classList.add('active');
    overlay.setAttribute('aria-hidden', 'false');

    startConfetti();
  }

  /* =====================================================
     CONFETTI (gold) — lightweight canvas implementation
     ===================================================== */
  let confettiRunning = false;
  let particles = [];
  let lastBurst = 0;
  let ctx, dpr;

  function resizeCanvas() {
    dpr = window.devicePixelRatio || 1;
    canvas.width  = Math.floor(window.innerWidth  * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
    canvas.style.width  = window.innerWidth  + 'px';
    canvas.style.height = window.innerHeight + 'px';
    if (ctx) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function rand(a, b) { return a + Math.random() * (b - a); }

  const GOLD_PALETTE = [
    '#f8d568', '#f1c232', '#d4af37', '#b8860b',
    '#fff1a8', '#e6c34a', '#caa84e'
  ];

  function spawnParticle(x, y) {
    const angle = rand(-Math.PI, 0);
    const speed = rand(4, 11);
    return {
      x, y,
      vx: Math.cos(angle) * speed + rand(-1, 1),
      vy: Math.sin(angle) * speed - rand(2, 6),
      gravity: rand(0.18, 0.30),
      drag: 0.992,
      size: rand(6, 12),
      rot: rand(0, Math.PI * 2),
      vr: rand(-0.25, 0.25),
      color: GOLD_PALETTE[(Math.random() * GOLD_PALETTE.length) | 0],
      shape: Math.random() < 0.5 ? 'rect' : 'tri',
      life: rand(220, 340)
    };
  }

  function burst(count, originX, originY) {
    for (let i = 0; i < count; i++) {
      particles.push(spawnParticle(originX, originY));
    }
  }

  function startConfetti() {
    if (confettiRunning) return;
    ctx = canvas.getContext('2d');
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    confettiRunning = true;
    const w = window.innerWidth;
    const h = window.innerHeight;

    burst(140, w * 0.5, h * 0.55);
    setTimeout(() => burst(90, w * 0.25, h * 0.55), 250);
    setTimeout(() => burst(90, w * 0.75, h * 0.55), 450);

    requestAnimationFrame(loop);
  }

  function loop(ts) {
    if (!confettiRunning) return;
    const w = window.innerWidth;
    const h = window.innerHeight;

    if (!lastBurst) lastBurst = ts;
    if (ts - lastBurst > 900) {
      const x = rand(w * 0.15, w * 0.85);
      const y = h * rand(0.45, 0.65);
      burst(50, x, y);
      lastBurst = ts;
    }

    ctx.clearRect(0, 0, w, h);

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.vx *= p.drag;
      p.vy = p.vy * p.drag + p.gravity;
      p.x  += p.vx;
      p.y  += p.vy;
      p.rot += p.vr;
      p.life -= 1;

      if (p.life <= 0 || p.y > h + 40) {
        particles.splice(i, 1);
        continue;
      }

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.shadowColor = 'rgba(248, 213, 104, 0.8)';
      ctx.shadowBlur = 8;

      if (p.shape === 'rect') {
        ctx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size / 1.6);
      } else {
        ctx.beginPath();
        ctx.moveTo(0, -p.size / 1.5);
        ctx.lineTo(p.size / 1.5, p.size / 1.5);
        ctx.lineTo(-p.size / 1.5, p.size / 1.5);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }

    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
